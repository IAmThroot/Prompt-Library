name: Build and Release Custom Node

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v1.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow aiohttp

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify compilation and syntax
        run: |
          python -m compileall -q __init__.py nodes.py db.py extract.py routes.py scanner.py service.py archives.py library.py validation.py
          node --input-type=module --check < web/prompt_library.js
          node --input-type=module --check < web/lifecycle.js
          node --experimental-vm-modules --test tests/test_frontend.mjs

      - name: Package custom node archive
        run: |
          mkdir -p build/prompt_library
          cp -r __init__.py nodes.py db.py extract.py routes.py scanner.py service.py archives.py library.py validation.py README.md CHANGELOG.md web build/prompt_library/
          cd build
          zip -r ../prompt_library.zip prompt_library -x "*.pyc" "*/__pycache__/*"
          cd ..
          sha256sum prompt_library.zip > prompt_library.zip.sha256
          rm -rf build

      - name: Publish Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            prompt_library.zip
            prompt_library.zip.sha256
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
